name: Build VenturaRTP v1.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build VenturaRTP
        run: gradle clean build --stacktrace

      - name: Upload VenturaRTP JAR
        uses: actions/upload-artifact@v4
        with:
          name: VenturaRTP-v1.2
          path: build/libs/VenturaRTP-1.2.0.jar
